codecov:
  require_ci_to_pass: yes

coverage:
  precision: 2
  round: down
  range: "70...100"
  status:
    project:
      default:
        target: auto    # Coverage must remain the same or increase
        threshold: 1%   # Allow 1% drop (noise)
    patch:
      default:
        target: 90%     # New code must be well tested

parsers:
  gcov:
    branch_detection:
      conditional: yes
      loop: yes
      method: no
      macro: no

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false  # Post comment even if coverage doesn't change
