name: Documentation

on:
  push:
    branches: [master, main, develop]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'pyproject.toml'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [master, main, develop]
    paths:
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-docs:
    name: Build Sphinx Documentation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: ${{ runner.os }}-poetry-docs-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-docs-

      - name: Install dependencies
        run: poetry install --with docs

      - name: Build Sphinx documentation
        working-directory: docs
        run: |
          make clean
          make html

      - name: Upload documentation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sphinx-documentation
          path: docs/_build/html/

      - name: Check for documentation warnings
        working-directory: docs
        run: |
          # Count warnings (non-critical, just informational)
          make clean
          make html 2>&1 | grep -i "WARNING" | tee doc-warnings.txt
          WARNING_COUNT=$(wc -l < doc-warnings.txt)
          echo "Found $WARNING_COUNT documentation warnings"
        continue-on-error: true

  check-links:
    name: Check Documentation Links
    runs-on: ubuntu-latest
    needs: build-docs

    steps:
      - uses: actions/checkout@v4

      - name: Download documentation artifacts
        uses: actions/download-artifact@v4
        with:
          name: sphinx-documentation
          path: docs/_build/html/

      - name: Check HTML links with lychee
        uses: lycheeverse/lychee-action@v1
        with:
          args: --accept 200,403,429 docs/_build/html/
        continue-on-error: true

  build-requirements:
    name: Verify Documentation Build Requirements
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Verify documentation dependencies in pyproject.toml
        run: |
          poetry show --only docs > /dev/null
          echo "✓ Documentation dependencies verified"
