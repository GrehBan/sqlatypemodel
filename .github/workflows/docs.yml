name: Documentation

on:
  push:
    branches: [master, main, develop]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'pyproject.toml'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [master, main, develop]
    paths:
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:

jobs:
  build-docs:
    name: Build Sphinx Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache Poetry dependencies
        uses: actions/cache@0c907a75c2c80ebcb7f088228285e798b750cf8f # v4.2.1
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: ${{ runner.os }}-poetry-docs-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-docs-

      - name: Install dependencies
        run: poetry install --with docs --all-extras

      - name: Build Sphinx documentation
        working-directory: docs
        run: |
          poetry run make clean
          poetry run make html

      - name: Upload documentation artifacts
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: sphinx-documentation
          path: docs/_build/html/

      - name: Check for documentation warnings
        working-directory: docs
        run: |
          # Count warnings (non-critical, just informational)
          poetry run make clean
          poetry run make html 2>&1 | grep -i "WARNING" | tee doc-warnings.txt
          WARNING_COUNT=$(wc -l < doc-warnings.txt)
          echo "Found $WARNING_COUNT documentation warnings"
        continue-on-error: true

  check-links:
    name: Check Documentation Links
    runs-on: ubuntu-latest
    needs: build-docs
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download documentation artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00b005971372dc801d16 # v4.1.8
        with:
          name: sphinx-documentation
          path: docs/_build/html/

      - name: Check HTML links with lychee
        uses: lycheeverse/lychee-action@2b973e86fc7b1f6b36a93795fe2c9c6ae1118621 # v1.10.0
        with:
          args: --accept 200,403,429 docs/_build/html/
        continue-on-error: true

  build-requirements:
    name: Verify Documentation Build Requirements
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Verify documentation dependencies in pyproject.toml
        run: |
          poetry show --only docs > /dev/null
          echo "✓ Documentation dependencies verified"
